<div class="row justify-content-center">

  <div class="col-12 col-md-7 col-lg-5">

    <div class="card shadow-sm">

      <div class="card-body">

        <h1 class="h3 mb-4">
          Administrator Login
        </h1>

        <form
          (ngSubmit)="onLoginSubmit()">

          <div class="mb-3">

            <label
              for="name"
              class="form-label">
              Name
            </label>

            <input
              id="name"
              name="name"
              type="text"
              class="form-control"
              [(ngModel)]="
                credentials.name
              ">

          </div>

          <div class="mb-3">

            <label
              for="email"
              class="form-label">
              Email
            </label>

            <input
              id="email"
              name="email"
              type="email"
              class="form-control"
              required
              [(ngModel)]="
                credentials.email
              ">

          </div>

          <div class="mb-3">

            <label
              for="password"
              class="form-label">
              Password
            </label>

            <input
              id="password"
              name="password"
              type="password"
              class="form-control"
              required
              [(ngModel)]="
                password
              ">

          </div>

          <button
            type="submit"
            class="btn btn-primary">
            Sign In
          </button>

        </form>

        <p
          *ngIf="message"
          class="mt-3 mb-0">
          {{ message }}
        </p>

      </div>

    </div>

  </div>

</div>
