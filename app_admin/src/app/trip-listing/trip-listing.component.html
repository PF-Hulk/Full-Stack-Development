<div
  class="d-flex flex-wrap
         justify-content-between
         align-items-center
         gap-2 mb-4">

  <div>

    <h1 class="h2 mb-1">
      Trip Administration
    </h1>

    <p
      class="text-muted mb-0">
      {{ message }}
    </p>

  </div>

  <a
    *ngIf="isLoggedIn()"
    class="btn btn-success"
    routerLink="/add-trip">
    Add Trip
  </a>

</div>

<div class="row g-4">

  <div
    *ngFor="
      let trip of trips
    "
    class="
      col-12
      col-md-6
      col-lg-4
      col-xl-3
    ">

    <app-trip-card
      [trip]="trip"
      (deleted)="
        onTripDeleted($event)
      ">
    </app-trip-card>

  </div>

</div>
