<div class="card h-100 shadow-sm">

  <div class="card-header fw-semibold">
    {{ trip.name }}
  </div>

  <img
    [src]="
      'assets/images/' +
      trip.image
    "
    [alt]="
      trip.name +
      ' thumbnail'
    "
    class="card-img-top">

  <div
    class="card-body
           d-flex flex-column">

    <h6
      class="card-subtitle
             mb-2 text-muted">
      {{ trip.resort }}
    </h6>

    <p
      class="card-subtitle
             mt-2 mb-3
             text-muted">
      {{ trip.length }}
      only
      {{
        trip.perPerson |
        currency:
          'USD':
          'symbol'
      }}
      per person
    </p>

    <div
      class="card-text
             flex-grow-1"
      [innerHTML]="
        trip.description
      ">
    </div>

    <div
      *ngIf="isLoggedIn()"
      class="d-flex gap-2 mt-3">

      <button
        type="button"
        class="btn btn-primary"
        (click)="
          editTrip(trip)
        ">
        Edit Trip
      </button>

      <button
        type="button"
        class="btn btn-outline-danger"
        (click)="
          deleteTrip(trip)
        ">
        Delete
      </button>

    </div>

  </div>

</div>
